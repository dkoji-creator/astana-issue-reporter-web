<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Icon set of Astana Issue Reporter. Own work, 24 x 24 grid, drawn with currentColor
       so one file serves every colour. Used as <svg><use href="/static/img/icons.svg#road"></use></svg> -->
  <symbol id="road" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3L4 21M16 3l4 18M12 4v2M12 10v2"/>
    <ellipse cx="12" cy="17" rx="3.2" ry="1.6" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="lighting" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 21h6M10 21V6a3 3 0 0 1 3-3h2a3 3 0 0 1 3 3v1"/>
    <path d="M15 7h6l-1.5 3h-3z" fill="currentColor"/>
    <path d="M18 13v1.5M15.2 12.5l-.8 1.2M20.8 12.5l.8 1.2"/>
  </symbol>
  <symbol id="landscaping" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-6"/>
    <path d="M12 3c3.6 0 6 3 6 6.2 0 3.2-2.7 5.8-6 5.8s-6-2.6-6-5.8C6 6 8.4 3 12 3z" fill="currentColor" fill-opacity=".25"/>
    <path d="M3 21h18"/>
  </symbol>
  <symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h16M9 6V4h6v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>
  </symbol>
  <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/>
    <circle cx="12" cy="10" r="2.5"/>
  </symbol>
  <symbol id="camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h4l2-3h6l2 3h4v12H3z"/>
    <circle cx="12" cy="13" r="3.5"/>
  </symbol>
  <symbol id="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
  </symbol>
  <symbol id="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path d="M16 9l5 6M21 9l-5 6"/>
  </symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12.5l5 5L20 6.5"/>
  </symbol>
</svg>
